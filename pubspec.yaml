name: uw_navigator
description: "Navigator app for within the UW campus. The app features a calendar system to allow the user to input their classes and navigate to the next build based on their schedule."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  path: ^1.9.0
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.0
  
  # Map & Location
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: ^2.1.0
  
  # Data Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  
  # HTTP & APIs
  http: ^1.6.0
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # UI
  cupertino_icons: ^1.0.8
  drift: ^2.31.0
  drift_flutter: ^0.3.0
  flutter_map_location_marker: ^8.1.0
  animated_text_kit: ^4.3.0
  flutter_polyline_points: ^3.1.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true

  assets:
    - assets/